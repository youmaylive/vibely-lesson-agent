<svg viewBox="-1122 -50 3245 800" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1000" height="700" fill="#f8f9fa"/>

  <text x="500" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333333" text-anchor="middle">Rising Blood Magnesium: Predictable Escalation</text>
  <text x="500" y="72" font-family="Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle">CNS/neuromuscular depression occurs in a fixed order as magnesium rises past therapeutic range</text>

  <!-- Rising magnesium arrow / timeline -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#666666"/>
    </marker>
  </defs>

  <line x1="80" y1="140" x2="920" y2="140" stroke="#666666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="90" y="120" font-family="Arial, sans-serif" font-size="16" fill="#333333" text-anchor="start">Therapeutic range</text>
  <text x="900" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333" text-anchor="end">Blood magnesium level rising →</text>

  <!-- Step 1 -->
  <rect x="90" y="190" width="240" height="130" rx="8" fill="#50C878"/>
  <text x="210" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 1: Earliest</text>
  <text x="210" y="260" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
    <tspan x="210" dy="0">Deep tendon</tspan>
    <tspan x="210" dy="1.2em">reflexes dampened</tspan>
  </text>
  <text x="210" y="305" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">(dampens first)</text>

  <!-- Step 2 -->
  <rect x="380" y="190" width="240" height="130" rx="8" fill="#F5A623"/>
  <text x="500" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 2: Middle</text>
  <text x="500" y="260" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
    <tspan x="500" dy="0">Respiratory drive</tspan>
    <tspan x="500" dy="1.2em">depressed</tspan>
  </text>
  <text x="500" y="305" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">(depresses next)</text>

  <!-- Step 3 -->
  <rect x="670" y="190" width="240" height="130" rx="8" fill="#FF6B6B"/>
  <text x="790" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Step 3: Latest</text>
  <text x="790" y="260" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
    <tspan x="790" dy="0">Cardiac conduction</tspan>
    <tspan x="790" dy="1.2em">affected</tspan>
  </text>
  <text x="790" y="305" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">(e.g. cardiac arrest)</text>

  <!-- connecting arrows between steps -->
  <line x1="330" y1="255" x2="380" y2="255" stroke="#666666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="620" y1="255" x2="670" y2="255" stroke="#666666" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- severity label -->
  <text x="500" y="365" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#333333" text-anchor="middle">Severity increases left to right as magnesium level rises</text>

  <!-- Explanation box: kidneys and gates -->
  <rect x="120" y="410" width="760" height="200" rx="8" fill="#4A90D9"/>
  <text x="500" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Why This Order Matters</text>

  <text x="500" y="480" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
    <tspan x="500" dy="0">Magnesium is excreted almost entirely by the kidneys.</tspan>
    <tspan x="500" dy="1.4em">If urine output drops, magnesium accumulates —</tspan>
    <tspan x="500" dy="1.4em">the drug isn't leaving the body as fast as it's going in.</tspan>
    <tspan x="500" dy="1.4em">This predictable order is precisely why the four gates exist —</tspan>
    <tspan x="500" dy="1.4em">each is a checkpoint that must be "open" (passed) before the next dose goes in.</tspan>
  </text>

  <!-- Gate checkpoints icons under boxes -->
  <text x="210" y="345" font-family="Arial, sans-serif" font-size="14" fill="#50C878" text-anchor="middle" font-weight="bold">Gate 1</text>
  <text x="500" y="345" font-family="Arial, sans-serif" font-size="14" fill="#F5A623" text-anchor="middle" font-weight="bold">Gate 2</text>
  <text x="790" y="345" font-family="Arial, sans-serif" font-size="14" fill="#FF6B6B" text-anchor="middle" font-weight="bold">Gate 3/4</text>
</svg>