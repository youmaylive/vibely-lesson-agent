[project]
name = "lesson-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # [bedrock] pulls boto3/botocore, which anthropic imports lazily inside
    # get_auth_headers() to SigV4-sign Bedrock requests. Without it, generate_svg
    # dies with "No module named 'botocore'" on every call under ECS (which
    # supplies AWS_ACCESS_KEY_ID/SECRET). A local shell with
    # AWS_BEARER_TOKEN_BEDROCK set takes the bearer path and never needs it,
    # which is why this only ever failed in prod.
    "anthropic[bedrock]>=0.120.2",
    "claude-agent-sdk>=0.1.34",
    # `openrouter.py` imports httpx directly. It is already installed transitively —
    # anthropic depends on it — but a dependency that is only transitively present is a
    # dependency nobody is holding: anthropic is free to drop or major-bump it, and the
    # break would surface as "no cover was generated" inside a worker rather than as a
    # resolution error at build time. Same shape as rule 22 (a gate's deps must be real
    # deps). No new download: the resolver already has it in uv.lock.
    "httpx>=0.28.1",
]
